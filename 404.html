<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#111112">
  <title>404 – Page not found</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23d2ff00'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' fill='black' font-family='Impact'%3EK%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link

    rel="stylesheet">
  <!-- absolute paths: Vercel serves this file for any unknown URL, at any depth -->
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/lando-fx.css">
<style>
    .nf { min-height: 100vh; display: grid; place-content: center; text-align: center; padding: 120px 24px 80px; position: relative; z-index: 1 }
    .nf .big { font: 400 clamp(140px, 30vw, 360px)/.85 var(--bb); color: transparent; -webkit-text-stroke: 2px var(--red); letter-spacing: .02em }
    .nf h1 { font: 400 clamp(32px, 5vw, 56px)/1 var(--bb); margin: 18px 0 10px; letter-spacing: .02em }
    .nf p { color: var(--mu); max-width: 480px; margin: 0 auto 28px }
  </style>
</head>

<body>
  <canvas id="aurora" aria-hidden="true"></canvas>
  <header class="dock">
    <nav class="nav" aria-label="Main navigation">
      <a class="brand" href="/" aria-label="Home"><i>KA</i>Kaka Anditya Pambayung</a>
      <div class="dr">
        <div class="lang-switch" role="group" aria-label="Language switcher">
          <button type="button" class="lang-btn active" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="id">ID</button>
        </div>
      </div>
    </nav>
  </header>
  <main>
    <section class="nf">
      <div class="big" aria-hidden="true">404</div>
      <h1 data-id="HALAMAN TIDAK DITEMUKAN">PAGE NOT FOUND</h1>
      <p data-id="Alamat yang kamu buka tidak ada atau sudah dipindahkan. Kembali ke beranda untuk melihat portofolio.">The page you opened does not exist or has moved. Head back home to see the portfolio.</p>
      <div><a class="btn r" href="/" data-id="KEMBALI KE BERANDA">BACK TO HOME</a></div>
    </section>
  </main>
  <script src="/assets/lando-fx.js"></script>
  <script src="/assets/detail.js"></script>
</body>

</html>
